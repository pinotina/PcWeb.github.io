<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milano Onde Radio - Web TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      padding: 10px;
    }

    /* BARRA SUPERIORE TITOLO BRANO */
    .song-banner {
      width: 100%;
      max-width: 1200px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ffcc;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      border: 2px solid #00ffcc;
      border-radius: 10px;
      margin-bottom: 10px;
      text-shadow: 0 0 5px #00ffcc;
    }

    /* PLAYER AUDIO DIRETTAMENTE DA AZURACAST */
    .audio-player-box {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 15px;
      text-align: center;
    }

    audio {
      width: 100%;
      max-width: 600px;
      height: 40px;
      border-radius: 8px;
    }

    /* CONTENITORE AFFIANCATO VIDEO + CHAT */
    .main-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }

    /* CONTENITORE VIDEO MP4 */
    .video-box {
      flex: 1;
      min-width: 320px;
      height: 486px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* CONTENITORE CHAT XAT */
    .chat-box {
      width: 728px;
      height: 486px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .chat-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .credits {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- BARRA TITOLO BRANO IN ONDA -->
  <div id="titolo-in-onda" class="song-banner">
    MILANO ONDE RADIO - Connessione in corso...
  </div>

  <!-- STREAMING AUDIO AZURACAST IN DIRETTA -->
  <div class="audio-player-box">
    <audio controls autoplay>
      <source src="https://a4.asurahosting.com/listen/milano_onde_radio/radio.mp3" type="audio/mpeg">
      Il tuo browser non supporta il lettore audio.
    </audio>
  </div>

  <div class="main-container">
    
    <!-- SINISTRA: VIDEO PLAYER MP4 AUTOMATICO -->
    <div class="video-box">
      <video id="video-centrale" autoplay loop muted playsinline>
        <source id="video-source" src="https://pinotina.github.io/PcWeb.github.io/SIMO.mp4" type="video/mp4">
        Il tuo browser non supporta il tag video.
      </video>
    </div>

    <!-- DESTRA: CHAT XAT -->
    <div class="chat-box">
      <iframe src="https://xat.com/embed/chat.php#id=220480838" allowTransparency="true"></iframe>
    </div>

  </div>

  <div class="credits">
    MILANO ONDE RADIO — Created by ACHILLE
  </div>

  <!-- SCRIPT DI AGGIORNAMENTO BRANO E VIDEO -->
  <script>
    // MAPPA DEI TUOI VIDEO MP4 SU GITHUB
    const libreriaVideo = {
      "whitney": "https://pinotina.github.io/PcWeb.github.io/SIMO.mp4",
      "default": "https://pinotina.github.io/PcWeb.github.io/SIMO.mp4"
    };

    let ultimoBrano = "";

    async function aggiornaBranoAzuraCast() {
      try {
        const response = await fetch('https://a4.asurahosting.com/api/nowplaying/milano_onde_radio');
        const data = await response.json();

        if (data && data.now_playing) {
          const branoAttuale = data.now_playing.song.text;
          document.getElementById('titolo-in-onda').innerText = "IN ONDA SU MILANO ONDE RADIO: " + branoAttuale;

          if (branoAttuale !== ultimoBrano) {
            ultimoBrano = branoAttuale;
            const branoLower = branoAttuale.toLowerCase();
            let nuovoVideo = libreriaVideo["default"];

            for (let chiave in libreriaVideo) {
              if (chiave !== "default" && branoLower.includes(chiave)) {
                nuovoVideo = libreriaVideo[chiave];
                break;
              }
            }

            const player = document.getElementById('video-centrale');
            const source = document.getElementById('video-source');
            
            if (source.src !== nuovoVideo) {
              source.src = nuovoVideo;
              player.load();
              player.play();
            }
          }
        }
      } catch (error) {
        console.error("Errore di connessione ad AzuraCast:", error);
      }
    }

    setInterval(aggiornaBranoAzuraCast, 5000);
    aggiornaBranoAzuraCast();
  </script>

</body>
</html>
