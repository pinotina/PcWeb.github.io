<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milano Onde Radio - Web TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }

    /* BARRA SUPERIORE TITOLO BRANO */
    .song-banner {
      width: 100%;
      max-width: 1200px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ffcc;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 18px;
      border: 2px solid #00ffcc;
      border-radius: 10px;
      margin-bottom: 20px;
      text-shadow: 0 0 5px #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
    }

    /* CONTENITORE PRINCIPALE AFFIANCATO */
    .main-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1200px;
    }

    /* BOX VIDEO */
    .video-box {
      flex: 1;
      min-width: 320px;
      height: 486px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .video-box iframe, .video-box video {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: cover;
    }

    /* BOX CHAT XAT */
    .chat-box {
      width: 728px;
      height: 486px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .chat-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* CREDITS */
    .credits {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- BARRA TITOLO BRANO IN ONDA -->
  <div id="titolo-in-onda" class="song-banner">
    MILANO ONDE RADIO - Connessione in corso...
  </div>

  <!-- CONTENITORE VIDEO + CHAT -->
  <div class="main-container">
    
    <!-- SINISTRA: VIDEO YOUTUBE AUTOMATICO -->
    <div class="video-box">
      <iframe id="player-youtube" 
              src="https://www.youtube.com/embed/videoseries?list=PL4fGSI1pDJn69On1f-8NAvX_CYL7MvI_n&autoplay=1&mute=1&loop=1" 
              allow="autoplay">
      </iframe>
    </div>

    <!-- DESTRA: CHAT XAT -->
    <div class="chat-box">
      <iframe src="https://xat.com/embed/chat.php#id=220480838" allowTransparency="true"></iframe>
    </div>

  </div>

  <div class="credits">
    MILANO ONDE RADIO — Created by ACHILLE
  </div>

  <!-- SCRIPT DI AGGIORNAMENTO BRANO AZURACAST -->
  <script>
    async function aggiornaBranoAzuraCast() {
      try {
        const response = await fetch('https://a4.asurahosting.com/api/nowplaying/milano_onde_radio');
        const data = await response.json();

        if (data && data.now_playing) {
          const branoAttuale = data.now_playing.song.text;
          document.getElementById('titolo-in-onda').innerText = "IN ONDA SU MILANO ONDE RADIO: " + branoAttuale;
        }
      } catch (error) {
        console.error("Errore di connessione ad AzuraCast:", error);
      }
    }

    setInterval(aggiornaBranoAzuraCast, 5000);
    aggiornaBranoAzuraCast();
  </script>

</body>
</html>
