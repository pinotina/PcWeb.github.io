<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milano Onde Radio - Web TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      padding: 10px;
    }

    /* BARRA SUPERIORE TITOLO BRANO */
    .song-banner {
      width: 100%;
      max-width: 1200px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ffcc;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      border: 2px solid #00ffcc;
      border-radius: 10px;
      margin-bottom: 15px;
      text-shadow: 0 0 5px #00ffcc;
    }

    /* CONTENITORE AFFIANCATO VIDEO + CHAT */
    .main-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }

    /* BOX VIDEO YOUTUBE */
    .video-box {
      flex: 1;
      min-width: 320px;
      height: 486px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* BOX CHAT XAT */
    .chat-box {
      width: 728px;
      height: 486px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .chat-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .credits {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- BARRA TITOLO BRANO IN ONDA -->
  <div id="titolo-in-onda" class="song-banner">
    MILANO ONDE RADIO - Connessione in corso...
  </div>

  <div class="main-container">
    
    <!-- SINISTRA: PLAYER VIDEO YOUTUBE AUTOMATICO -->
    <div class="video-box">
      <iframe id="player-youtube" 
              src="https://www.youtube-nocookie.com/embed?listType=search&list=music+video&autoplay=1" 
              allow="autoplay; encrypted-media" 
              allowfullscreen>
      </iframe>
    </div>

    <!-- DESTRA: CHAT XAT -->
    <div class="chat-box">
      <iframe src="https://xat.com/embed/chat.php#id=220480838" allowTransparency="true"></iframe>
    </div>

  </div>

  <div class="credits">
    MILANO ONDE RADIO — Created by ACHILLE
  </div>

  <!-- SCRIPT PULIZIA E RICERCA VIDEO AUTOMATICA -->
  <script>
    let ultimoBrano = "";

    function pulisciTitoloBrano(titolo) {
      // Rimuove tag ed estensioni che bloccano la ricerca su YouTube
      return titolo
        .replace(/greatest hits.*/gi, '')
        .replace(/best songs.*/gi, '')
        .replace(/\(hq audio\)/gi, '')
        .replace(/\(official video\)/gi, '')
        .replace(/\(official music video\)/gi, '')
        .replace(/2026|2025|2024/g, '')
        .trim();
    }

    async function aggiornaBranoAzuraCast() {
      try {
        const response = await fetch('https://a4.asurahosting.com/api/nowplaying/milano_onde_radio');
        const data = await response.json();

        if (data && data.now_playing) {
          const branoGrezzo = data.now_playing.song.text;
          document.getElementById('titolo-in-onda').innerText = "IN ONDA SU MILANO ONDE RADIO: " + branoGrezzo;

          if (branoGrezzo !== ultimoBrano) {
            ultimoBrano = branoGrezzo;
            
            // Pulisce il nome della canzone per trovare il videoclip reale
            const titoloPulito = pulisciTitoloBrano(branoGrezzo);
            const ricercaQuery = encodeURIComponent(titoloPulito + " official music video");
            
            const iframe = document.getElementById('player-youtube');
            iframe.src = `https://www.youtube-nocookie.com/embed?listType=search&list=${ricercaQuery}&autoplay=1`;
          }
        }
      } catch (error) {
        console.error("Errore di connessione ad AzuraCast:", error);
      }
    }

    setInterval(aggiornaBranoAzuraCast, 5000);
    aggiornaBranoAzuraCast();
  </script>

</body>
</html>
