<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milano Onde Radio - Web TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    /* BARRA TITOLO BRANO IN ONDA IN ALTO */
    .song-banner {
      width: 100%;
      max-width: 900px;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      border: 2px solid #00ffcc;
      border-radius: 10px 10px 0 0;
      text-shadow: 0 0 5px #00ffcc;
    }

    /* CONTENITORE TV */
    .tv-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 500px;
      border: 4px solid #333;
      border-top: none;
      border-radius: 0 0 16px 16px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* VIDEO YOUTUBE IN SFONDO */
    .youtube-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      border: none;
      pointer-events: none; /* Impedisce interruzioni al video */
    }

    /* CHAT DI XAT SOVRAPPOSTA */
    .chat-overlay {
      position: absolute;
      bottom: 10px;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .credits {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- BARRA INFO BRANO IN ONDA -->
  <div id="titolo-in-onda" class="song-banner">
    MILANO ONDE RADIO - Connessione in corso...
  </div>

  <div class="tv-container">
    <!-- PLAYER YOUTUBE IN SFONDO -->
    <!-- Inserisci l'ID del video YouTube dopo /embed/ (es: dQw4w9WgXcQ) -->
    <iframe id="player-youtube" class="youtube-video" 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&loop=1&playlist=dQw4w9WgXcQ" 
            allow="autoplay">
    </iframe>

    <!-- BOX CHAT XAT SOVRAPPOSTO -->
    <div class="chat-overlay">
      <iframe src="https://xat.com/embed/chat.php#id=220480838" width="650" height="380" allowTransparency="true"></iframe>
    </div>
  </div>

  <div class="credits">
    MILANO ONDE RADIO — Created by ACHILLE
  </div>

  <!-- SCRIPT DI CONNESSIONE AD AZURACAST E YOUTUBE -->
  <script>
    // LISTA VIDEO YOUTUBE ASSOCIATI AI BRANI (Inserisci gli ID dei video di YouTube)
    const libreriaYouTube = {
      "whitney": "dQw4w9WgXcQ", // Esempio ID video YouTube
      "default": "dQw4w9WgXcQ"  // Video di default
    };

    let ultimoBrano = "";

    async function aggiornaBranoAzuraCast() {
      try {
        const response = await fetch('https://a4.asurahosting.com/api/nowplaying/milano_onde_radio');
        const data = await response.json();

        if (data && data.now_playing) {
          const branoAttuale = data.now_playing.song.text;
          
          document.getElementById('titolo-in-onda').innerText = "IN ONDA SU MILANO ONDE RADIO: " + branoAttuale;

          if (branoAttuale !== ultimoBrano) {
            ultimoBrano = branoAttuale;
            const branoLower = branoAttuale.toLowerCase();
            let nuovoIdYouTube = libreriaYouTube["default"];

            for (let chiave in libreriaYouTube) {
              if (chiave !== "default" && branoLower.includes(chiave)) {
                nuovoIdYouTube = libreriaYouTube[chiave];
                break;
              }
            }

            const iframeYouTube = document.getElementById('player-youtube');
            const nuovoSrc = `https://www.youtube.com/embed/${nuovoIdYouTube}?autoplay=1&mute=1&controls=0&loop=1&playlist=${nuovoIdYouTube}`;
            
            if (iframeYouTube.src !== nuovoSrc) {
              iframeYouTube.src = nuovoSrc;
            }
          }
        }
      } catch (error) {
        console.error("Errore di connessione ad AzuraCast:", error);
      }
    }

    setInterval(aggiornaBranoAzuraCast, 5000);
    aggiornaBranoAzuraCast();
  </script>

</body>
</html>
