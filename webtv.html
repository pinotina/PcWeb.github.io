<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milano Onde Radio - Web TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      padding: 10px;
    }

    /* BARRA SUPERIORE TITOLO BRANO IN ONDA */
    .song-banner {
      width: 100%;
      max-width: 1200px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ffcc;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      border: 2px solid #00ffcc;
      border-radius: 10px;
      margin-bottom: 10px;
      text-shadow: 0 0 5px #00ffcc;
    }

    /* PULSANTE PER ABILITARE L'AUDIO (REQUISITO BROWSER) */
    .audio-btn {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 15px;
      box-shadow: 0 0 10px #00ffcc;
      transition: 0.3s;
    }

    .audio-btn:hover {
      background: #fff;
      box-shadow: 0 0 20px #fff;
    }

    /* CONTENITORE AFFIANCATO VIDEO + CHAT */
    .main-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }

    /* CONTENITORE VIDEO YOUTUBE */
    .video-box {
      flex: 1;
      min-width: 320px;
      height: 486px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* CONTENITORE CHAT XAT */
    .chat-box {
      width: 728px;
      height: 486px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .chat-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .credits {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- BARRA TITOLO BRANO -->
  <div id="titolo-in-onda" class="song-banner">
    MILANO ONDE RADIO - Connessione in corso...
  </div>

  <!-- BOTTONE PER ABILITARE AUDIO SUI BROWSER -->
  <button id="btn-audio" class="audio-btn" onclick="attivaAudio()">🔊 CLICCA QUI PER ATTIVARE L'AUDIO DELLA TV</button>

  <div class="main-container">
    
    <!-- SINISTRA: PLAYER VIDEO AUTOMATICO YOUTUBE -->
    <div class="video-box">
      <iframe id="player-youtube" 
              src="https://www.youtube.com/embed?listType=search&list=music+video&autoplay=1&mute=1" 
              allow="autoplay">
      </iframe>
    </div>

    <!-- DESTRA: CHAT XAT -->
    <div class="chat-box">
      <iframe src="https://xat.com/embed/chat.php#id=220480838" allowTransparency="true"></iframe>
    </div>

  </div>

  <div class="credits">
    MILANO ONDE RADIO — Created by ACHILLE
  </div>

  <script>
    let ultimoBrano = "";
    let audioAttivo = false;

    function attivaAudio() {
      audioAttivo = true;
      const iframe = document.getElementById('player-youtube');
      // Sblocca audio ricaricando il video corrente senza mute
      if (ultimoBrano !== "") {
        iframe.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(ultimoBrano + " official music video")}&autoplay=1&mute=0`;
      }
      document.getElementById('btn-audio').style.display = 'none';
    }

    async function aggiornaBranoAzuraCast() {
      try {
        const response = await fetch('https://a4.asurahosting.com/api/nowplaying/milano_onde_radio');
        const data = await response.json();

        if (data && data.now_playing) {
          const branoAttuale = data.now_playing.song.text;
          document.getElementById('titolo-in-onda').innerText = "IN ONDA SU MILANO ONDE RADIO: " + branoAttuale;

          // Se la canzone mandata dal DJ cambia
          if (branoAttuale !== ultimoBrano) {
            ultimoBrano = branoAttuale;
            const iframe = document.getElementById('player-youtube');
            const muteParam = audioAttivo ? "0" : "1";
            
            // Cerca automaticamente il video musicale su YouTube basandosi sul brano in onda
            iframe.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(branoAttuale + " official music video")}&autoplay=1&mute=${muteParam}`;
          }
        }
      } catch (error) {
        console.error("Errore di connessione ad AzuraCast:", error);
      }
    }

    setInterval(aggiornaBranoAzuraCast, 5000);
    aggiornaBranoAzuraCast();
  </script>

</body>
</html>
