<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milano Onde Radio - Web TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }

    /* CONTENITORE PRINCIPALE STILE TV */
    .tv-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 600px;
      border: 4px solid #333;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
      background: #000;
    }

    /* VIDEO MP4 IN SFONDO */
    .tv-background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* CHAT DI XAT SOVRAPPOSTA AL VIDEO */
    .chat-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* BARRA TITOLO BRANO IN ONDA IN ALTO */
    .song-banner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      font-size: 16px;
      z-index: 3;
      border-bottom: 2px solid #00ffcc;
      text-shadow: 0 0 5px #00ffcc;
    }

    /* FIRMA CREDITS IN BASSO */
    .credits {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
    }

    iframe {
      border: none;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <!-- BARRA INFO BRANO IN ONDA -->
    <div id="titolo-in-onda" class="song-banner">
      MILANO ONDE RADIO - Connessione in corso...
    </div>

    <!-- VIDEO PLAYER MP4 CENTRALE (SFONDO) -->
    <video id="video-centrale" class="tv-background-video" autoplay loop muted playsinline>
      <source id="video-source" src="https://pinotina.github.io/PcWeb.github.io/SIMO.mp4" type="video/mp4">
      Il tuo browser non supporta il tag video.
    </video>

    <!-- BOX CHAT XAT SOVRAPPOSTO -->
    <div class="chat-overlay">
      <iframe src="https://xat.com/embed/chat.php#id=220480838" width="728" height="486" allowTransparency="true"></iframe>
    </div>
  </div>

  <div class="credits">
    MILANO ONDE RADIO — Created by ACHILLE
  </div>

  <!-- SCRIPT DI CONNESSIONE AD AZURACAST -->
  <script>
    // MAPPA VIDEO MP4 PERSONALIZZATI SU GITHUB PAGES
    const libreriaVideo = {
      "default": "https://pinotina.github.io/PcWeb.github.io/SIMO.mp4"
    };

    let ultimoBrano = "";

    async function aggiornaBranoAzuraCast() {
      try {
        const response = await fetch('https://a4.asurahosting.com/api/nowplaying/milano_onde_radio');
        const data = await response.json();

        if (data && data.now_playing) {
          const branoAttuale = data.now_playing.song.text;
          
          document.getElementById('titolo-in-onda').innerText = "IN ONDA SU MILANO ONDE RADIO: " + branoAttuale;

          if (branoAttuale !== ultimoBrano) {
            ultimoBrano = branoAttuale;
            const branoLower = branoAttuale.toLowerCase();
            let nuovoVideo = libreriaVideo["default"];

            for (let chiave in libreriaVideo) {
              if (chiave !== "default" && branoLower.includes(chiave)) {
                nuovoVideo = libreriaVideo[chiave];
                break;
              }
            }

            const player = document.getElementById('video-centrale');
            const source = document.getElementById('video-source');
            
            if (source.src !== nuovoVideo) {
              source.src = nuovoVideo;
              player.load();
              player.play();
            }
          }
        }
      } catch (error) {
        console.error("Errore di connessione ad AzuraCast:", error);
      }
    }

    setInterval(aggiornaBranoAzuraCast, 5000);
    aggiornaBranoAzuraCast();
  </script>

</body>
</html>
