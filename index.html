<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milano Onde Radio - Dashboard</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #000;
        }
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-width: 100% !important;
            min-height: 100% !important;
            object-fit: cover !important;
            object-position: center center !important;
            transform: scale(1.02);
            z-index: -1;
        }
        .content {
            position: relative;
            z-index: 1;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 20vh;
        }
    </style>
</head>
<body>

    <!-- Sfondo video corretto -->
    <video src="lory.mp4" autoplay loop muted playsinline></video>

    <div class="content">
        <h1>Milano Onde Radio</h1>
        <p>In onda con ACHILLE</p>
    </div>

</body>
</html>
