    /* Fasci di luce allungati */

      mix-blend-mode: screen;
      filter: blur(2px);
      transform-origin: top center;
      clip-path: polygon(44% 0, 0 100%, 100% 100%, 56% 0);
    }

    .beam-laser   { background: linear-gradient(to bottom, rgba(255,100,0,0.9), rgba(255,100,0,0.2) 60%, transparent); }

    @keyframes strobeSlow {

  <script>
    function changeColor(color) { 
      document.body.setAttribute('data-c', color); 
    }

    // Movimento dinamico della lancetta dello strumento wsmider
    function animateNeedle() {
      let beatValue = -45 + Math.random() * 65;
      document.getElementById('nL').style.transform = `rotate(${beatValue}deg)`;
      setTimeout(animateNeedle, 130);
    }
    animateNeedle();

    // Aggiornamento brani e ascoltatori da AzuraCast
    async function aggiornaBranoAzuraCast() {
      try {
        const response = await fetch('https://a4.asurahosting.com/api/nowplaying/milano_onde_radio?t=' + Date.now());
        const data = await response.json();

        let stationData = Array.isArray(data) ? data[0] : data;

        if (stationData) {
          let ascoltatori = stationData.listeners ? stationData.listeners.current : 0;
          document.getElementById('ascoltatori-online').innerText = "Ascoltatori online: " + ascoltatori;

          let np = stationData.now_playing;
          if (np && np.song) {
            if (np.song.text) {
              document.getElementById('titolo-in-onda').innerText = "IN ONDA: " + np.song.text;
            }
            let copertinaUrl = np.song.art || np.art;
            if (copertinaUrl) {
              if (copertinaUrl.startsWith('/')) {
                copertinaUrl = 'https://a4.asurahosting.com' + copertinaUrl;
              }
              document.getElementById('cover-artista').src = copertinaUrl;
            }
          }
        }
      } catch (error) {
        console.error("Errore di connessione ad AzuraCast:", error);
      }
    }

    setInterval(aggiornaBranoAzuraCast, 5000);
    aggiornaBranoAzuraCast();
  </script>
