<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ACHILLE - Milano Onde Radio</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .video-container {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Sfondo video che punta direttamente al tuo server -->
    <div class="video-container">
        <video autoplay muted loop playsinline>
            <source src="http://milanonderadio.org:8080/video/bolton.mp4" type="video/mp4">
            Il tuo browser non supporta il tag video.
        </video>
    </div>

    <!-- Qui dentro puoi incollare il resto della tua grafica, chat e riquadri -->
    <div style="position: relative; z-index: 1; padding: 20px;">
        <h1>ACHILLE - Milano Onde Radio</h1>
        <p>La radio è online e i video caricano correttamente dal server!</p>
    </div>

</body>
</html>
